name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The TypeScript suites. The headless Godot and browser-render suites
      # (game/test, render tests) need Godot 4.7 and run locally via `npm test`.
      - run: npx vitest run packages apps
        env:
          SKIP_BROWSER_TESTS: "1"
          ARCHITECT_PROPERTY_PLANS: "20"
